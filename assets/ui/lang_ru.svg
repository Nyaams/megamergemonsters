<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="circle_ru">
      <circle cx="32" cy="32" r="26"/>
    </clipPath>
  </defs>
  <!-- Outer Gold Rim -->
  <circle cx="32" cy="32" r="28" fill="#1A1528" stroke="#F0DC82" stroke-width="2.5"/>
  <!-- Russian Flag Tricolor -->
  <g clip-path="url(#circle_ru)">
    <rect x="5" y="5" width="54" height="18" fill="#FFFFFF"/>
    <rect x="5" y="23" width="54" height="18" fill="#1C5AB8"/>
    <rect x="5" y="41" width="54" height="18" fill="#D52B1E"/>
  </g>
  <!-- Center Badge for high readability -->
  <rect x="13" y="19" width="38" height="26" rx="7" fill="#141122" fill-opacity="0.85" stroke="#F0DC82" stroke-width="1.5"/>
  <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="16" fill="#FFF4D0" text-anchor="middle" letter-spacing="1">RU</text>
</svg>
